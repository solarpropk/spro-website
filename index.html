
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c2d">
<title>Solar Pro | Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,sans-serif;color:#172b22;background:#f3f6f4}
*{box-sizing:border-box}
body{margin:0}
header{background:#123c2d;color:white;padding:20px}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;color:#d4e7dc}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0000000a}
h2{font-size:19px;margin:0 0 14px}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccd7d0;font:inherit}
button{background:#176b49;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e6efe9;color:#123c2d}
button:disabled{opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#e6efe9;padding:14px;border-radius:10px}
.stat strong{display:block;font-size:24px;margin-top:8px}
.item{padding:12px 0;border-bottom:1px solid #e5ebe7;overflow-wrap:anywhere}
.item:last-child{border:0}
.muted{color:#66766d;font-size:13px}
.tag{display:inline-block;background:#e6efe9;border-radius:20px;padding:5px 9px;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.error{color:#b42318;white-space:pre-wrap}
.success{color:#176b49}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>☀ Solar Pro</h1>
  <p>Cleaning Management System</p>
</header>

<main>
<section class="card" id="login">
  <h2>Admin & Worker Login</h2>
  <p class="muted">Sign in using an account created in Supabase.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email address" required autocomplete="username">
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p id="loginMessage" class="error"></p>
</section>

<section id="app" class="hidden">
  <div class="card">
    <div class="row">
      <div>
        <h2 id="welcome">Dashboard</h2>
        <p id="roleLabel" class="muted"></p>
      </div>
      <div><button id="logout" class="secondary">Sign out</button></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">Customers<strong id="customerCount">0</strong></div>
    <div class="stat">Total jobs<strong id="jobCount">0</strong></div>
    <div class="stat">Scheduled<strong id="scheduledCount">0</strong></div>
  </div>

  <section id="adminTools" class="hidden">
    <div class="card">
      <h2>Add a Customer</h2>
      <form id="customerForm">
        <input id="customerName" placeholder="Customer full name" required>
        <input id="customerPhone" type="tel" placeholder="Phone number" required>
        <textarea id="customerAddress" placeholder="Full address" required></textarea>
        <input id="customerArea" placeholder="Area / neighbourhood">
        <textarea id="customerNotes" placeholder="Additional notes (optional)"></textarea>
        <button type="submit">Save Customer</button>
      </form>
      <p id="customerMessage" class="muted"></p>
    </div>

    <div class="card">
      <h2>Schedule a Cleaning Job</h2>
      <form id="jobForm">
        <label for="jobCustomer" class="muted">Customer</label>
        <select id="jobCustomer" required></select>
        <label for="jobWorker" class="muted">Assigned worker</label>
        <select id="jobWorker">
          <option value="">Unassigned</option>
        </select>
        <label for="jobDate" class="muted">Cleaning date</label>
        <input id="jobDate" type="date" required>
        <textarea id="jobNotes" placeholder="Job instructions (optional)"></textarea>
        <button type="submit">Schedule Job</button>
      </form>
      <p id="jobMessage" class="muted"></p>
    </div>
  </section>

  <div class="card">
    <h2 id="jobsHeading">Cleaning Jobs</h2>
    <div id="jobsList">Loading jobs...</div>
  </div>

  <div class="card" id="customersCard">
    <h2>Customers</h2>
    <input id="customerSearch" placeholder="Search name, phone or address">
    <div id="customersList">Loading customers...</div>
  </div>
</section>
</main>

<script>
const SUPABASE_URL = "https://wkixbopotjxmvhrvigmj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__B2KEyCzi_wyo7EkTHmDUQ_jH9vt1L";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let currentRole = null;
let customers = [];
let workers = [];
let jobs = [];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function message(id, text, isError=false) {
  $(id).textContent = text;
  $(id).className = isError ? "error" : "muted";
}

function showError(error) {
  return error?.message || "Something went wrong. Please try again.";
}

async function loadDashboard() {
  const {data: profile, error: profileError} = await db
    .from("profiles")
    .select("full_name, role")
    .eq("id", currentUser.id)
    .single();

  if (profileError || !profile) {
    throw new Error("Your profile could not be loaded. Check that your profile exists in Supabase.");
  }

  currentRole = profile.role;
  $("welcome").textContent = "Hello, " + (profile.full_name || "Team");
  $("roleLabel").textContent = "Signed in as " + currentRole;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("adminTools").classList.toggle("hidden", currentRole !== "admin");
  $("customersCard").classList.toggle("hidden", currentRole !== "admin");
  $("jobsHeading").textContent = currentRole === "admin" ? "All Cleaning Jobs" : "My Assigned Jobs";

  await loadData();
}

async function loadData() {
  const customerResult = await db.from("customers")
    .select("*").order("created_at", {ascending:false});

  if (customerResult.error) throw customerResult.error;
  customers = customerResult.data || [];

  const workerResult = currentRole === "admin"
    ? await db.from("profiles").select("id, full_name").eq("role","worker")
    : {data:[], error:null};

  if (workerResult.error) throw workerResult.error;
  workers = workerResult.data || [];

  const jobResult = await db.from("jobs")
    .select("*").order("created_at", {ascending:false});

  if (jobResult.error) throw jobResult.error;
  jobs = jobResult.data || [];

  $("customerCount").textContent = currentRole === "admin"
    ? customers.length : "—";
  $("jobCount").textContent = jobs.length;
  $("scheduledCount").textContent =
    jobs.filter(j => j.status === "scheduled").length;

  renderCustomers();
  renderJobs();
  fillSelects();
}

function fillSelects() {
  $("jobCustomer").innerHTML = customers.map(c =>
    `<option value="${esc(c.id)}">${esc(c.full_name)} — ${esc(c.customer_code)}</option>`
  ).join("");

  $("jobWorker").innerHTML =
    '<option value="">Unassigned</option>' +
    workers.map(w =>
      `<option value="${esc(w.id)}">${esc(w.full_name)}</option>`
    ).join("");
}

function renderCustomers() {
  const search = $("customerSearch").value.toLowerCase();
  const filtered = customers.filter(c =>
    [c.full_name,c.phone,c.address,c.customer_code]
      .some(v => String(v || "").toLowerCase().includes(search))
  );

  $("customersList").innerHTML = filtered.length ? filtered.map(c => `
    <div class="item">
      <strong>${esc(c.full_name)}</strong>
      <div><span class="tag">${esc(c.customer_code)}</span></div>
      <p>${esc(c.phone)}<br>${esc(c.address)}</p>
      <div class="muted">${esc(c.area || "")}</div>
    </div>`).join("") : '<p class="muted">No customers found.</p>';
}

function renderJobs() {
  $("jobsList").innerHTML = jobs.length ? jobs.map(j => {
    const c = customers.find(x => x.id === j.customer_id);
    const w = workers.find(x => x.id === j.assigned_worker_id);
    return `<div class="item">
      <strong>${esc(c?.full_name || "Customer record")}</strong>
      <div class="muted">${esc(c?.phone || "")}</div>
      <p>Date: ${esc(j.scheduled_date || "Not set")}</p>
      <p>Worker: ${esc(w?.full_name || (j.assigned_worker_id ? "Assigned worker" : "Unassigned"))}</p>
      <span class="tag">${esc(j.status)}</span>
      <p>${esc(j.notes || "")}</p>
      ${currentRole === "admin" ? `
        <label class="muted" for="status-${esc(j.id)}">Update job status</label>
        <select id="status-${esc(j.id)}">
          ${["scheduled","in_progress","completed","cancelled"].map(s =>
            `<option value="${s}" ${j.status===s?"selected":""}>${s.replace("_"," ")}</option>`
          ).join("")}
        </select>
        <button class="secondary" data-save-status="${esc(j.id)}">Save status</button>
      ` : ""}
    </div>`;
  }).join("") : '<p class="muted">No cleaning jobs yet.</p>';
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  message("loginMessage", "Signing in...");
  const {data, error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if (error) {
    message("loginMessage", showError(error), true);
    return;
  }
  currentUser = data.user;
  try {
    await loadDashboard();
  } catch (err) {
    message("loginMessage", showError(err), true);
    await db.auth.signOut();
  }
});

$("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  currentRole = null;
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("password").value = "";
});

$("customerForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (currentRole !== "admin") return;
  message("customerMessage", "Saving customer...");
  const {error} = await db.from("customers").insert({
    full_name:$("customerName").value.trim(),
    phone:$("customerPhone").value.trim(),
    address:$("customerAddress").value.trim(),
    area:$("customerArea").value.trim() || null,
    notes:$("customerNotes").value.trim() || null
  });
  if (error) {
    message("customerMessage", showError(error), true);
    return;
  }
  e.target.reset();
  message("customerMessage", "Customer saved successfully.");
  await loadData();
});

$("jobForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (currentRole !== "admin") return;
  message("jobMessage", "Scheduling job...");
  const {error} = await db.from("jobs").insert({
    customer_id:$("jobCustomer").value,
    assigned_worker_id:$("jobWorker").value || null,
    scheduled_date:$("jobDate").value,
    notes:$("jobNotes").value.trim() || null
  });
  if (error) {
    message("jobMessage", showError(error), true);
    return;
  }
  e.target.reset();
  message("jobMessage", "Cleaning job scheduled.");
  await loadData();
});

$("customerSearch").addEventListener("input", renderCustomers);

$("jobsList").addEventListener("click", async e => {
  const id = e.target.dataset.saveStatus;
  if (!id || currentRole !== "admin") return;
  const status = $("status-" + id).value;
  const {error} = await db.from("jobs").update({status}).eq("id",id);
  if (error) {
    alert(showError(error));
    return;
  }
  await loadData();
});

(async function init() {
  const {data} = await db.auth.getSession();
  if (data.session) {
    currentUser = data.session.user;
    try {
      await loadDashboard();
    } catch (err) {
      message("loginMessage", showError(err), true);
      $("login").classList.remove("hidden");
      await db.auth.signOut();
    }
  }
})();
</script>
</body>
  </html>
